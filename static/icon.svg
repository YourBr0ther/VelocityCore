<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0015"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#bf00ff"/>
    </linearGradient>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring)" stroke-width="8" filter="url(#glow)"/>

  <!-- Speed rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ff0080" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.2"/>

  <!-- Audio waveform (behind V) -->
  <g filter="url(#glow-soft)" opacity="0.6">
    <rect x="90" y="240" width="8" height="32" rx="4" fill="#00ffff"/>
    <rect x="110" y="220" width="8" height="72" rx="4" fill="#00ffff"/>
    <rect x="130" y="200" width="8" height="112" rx="4" fill="#00ffff"/>
    <rect x="150" y="230" width="8" height="52" rx="4" fill="#00ffff"/>

    <rect x="354" y="230" width="8" height="52" rx="4" fill="#ff0080"/>
    <rect x="374" y="200" width="8" height="112" rx="4" fill="#ff0080"/>
    <rect x="394" y="220" width="8" height="72" rx="4" fill="#ff0080"/>
    <rect x="414" y="240" width="8" height="32" rx="4" fill="#ff0080"/>
  </g>

  <!-- Main V shape with speed trail -->
  <g filter="url(#glow)">
    <!-- Speed trails -->
    <path d="M180 140 L165 145" stroke="#00ffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M190 160 L170 165" stroke="#00ffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M200 180 L175 187" stroke="#00ffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- V letterform -->
    <path d="M180 130 L256 360 L332 130"
          fill="none"
          stroke="url(#v-grad)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Inner V highlight -->
    <path d="M195 155 L256 330 L317 155"
          fill="none"
          stroke="#fff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.4"/>
  </g>

  <!-- Arrow tip at bottom of V -->
  <g filter="url(#glow)">
    <polygon points="256,380 240,350 272,350" fill="#ff0080"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff">
    <circle cx="400" cy="100" r="3"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="440" cy="400" r="2"/>
    <circle cx="80" cy="150" r="2"/>
  </g>

  <!-- CORE text -->
  <text x="256" y="450"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28"
        font-weight="700"
        fill="url(#ring)"
        text-anchor="middle"
        letter-spacing="8"
        filter="url(#glow-soft)">CORE</text>
</svg>
