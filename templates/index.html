<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelocityCore - Nightcore Generator</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #ff1493;
            --neon-cyan: #00ffff;
            --neon-purple: #9400d3;
            --deep-void: #050510;
            --dark-purple: #0a0018;
            --glow-pink: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 40px #ff1493;
            --glow-cyan: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            --glow-purple: 0 0 10px #9400d3, 0 0 20px #9400d3, 0 0 40px #9400d3;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--deep-void);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }

        /* Animated Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(148, 0, 211, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 20, 147, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 70%),
                linear-gradient(180deg, var(--deep-void) 0%, var(--dark-purple) 100%);
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0;
        }

        .particle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            border-radius: 50%;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Scan Lines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            position: relative;
            animation: logoGlow 3s ease-in-out infinite;
        }

        .logo h1::before {
            content: 'VELOCITYCORE';
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.7;
        }

        @keyframes logoGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .logo .tagline {
            font-size: 1.1rem;
            letter-spacing: 0.5em;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: var(--glow-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Main Card */
        .converter-card {
            background: rgba(10, 0, 25, 0.8);
            border: 1px solid rgba(255, 20, 147, 0.3);
            border-radius: 2px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .converter-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 400% 400%;
            z-index: -1;
            border-radius: 3px;
            animation: borderGlow 8s ease infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Corner Accents */
        .converter-card::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 1px;
            pointer-events: none;
        }

        /* Input Section */
        .input-section {
            margin-bottom: 2rem;
        }

        .input-label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .url-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 20, 147, 0.3);
            border-radius: 2px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .url-input:focus {
            border-color: var(--neon-pink);
            box-shadow: var(--glow-pink), inset 0 0 20px rgba(255, 20, 147, 0.1);
        }

        /* Convert Button */
        .convert-btn {
            width: 100%;
            padding: 1.2rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            border: none;
            border-radius: 2px;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .convert-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .convert-btn:hover::before {
            left: 100%;
        }

        .convert-btn:hover {
            box-shadow: var(--glow-pink);
            transform: translateY(-2px);
        }

        .convert-btn:active {
            transform: translateY(0);
        }

        .convert-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Section */
        .progress-section {
            display: none;
            margin-top: 2rem;
        }

        .progress-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: statusPulse 1s ease-in-out infinite;
        }

        .status-downloading .status-dot { background: var(--neon-cyan); box-shadow: var(--glow-cyan); }
        .status-converting .status-dot { background: var(--neon-purple); box-shadow: var(--glow-purple); }
        .status-complete .status-dot { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-error .status-dot { background: #ff3333; box-shadow: 0 0 10px #ff3333; }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
            border-radius: 2px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, #fff);
            animation: progressShine 1s ease-in-out infinite;
        }

        @keyframes progressShine {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.5; }
        }

        /* Player Section */
        .player-section {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 20, 147, 0.2);
        }

        .player-section.active {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
            color: var(--neon-cyan);
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: var(--glow-cyan);
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 60px;
            margin-bottom: 1.5rem;
        }

        .visualizer-bar {
            width: 4px;
            background: linear-gradient(to top, var(--neon-pink), var(--neon-cyan));
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .visualizer.playing .visualizer-bar {
            animation: visualize 0.5s ease-in-out infinite;
        }

        @keyframes visualize {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* Audio Controls */
        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .play-btn:hover {
            box-shadow: var(--glow-pink);
            transform: scale(1.1);
        }

        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .play-btn .play-icon {
            margin-left: 4px;
        }

        .play-btn .pause-icon {
            display: none;
        }

        .play-btn.playing .play-icon {
            display: none;
        }

        .play-btn.playing .pause-icon {
            display: block;
        }

        /* Time Display */
        .time-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.1em;
        }

        /* Seek Bar */
        .seek-container {
            margin-bottom: 1.5rem;
        }

        .seek-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon-pink);
            box-shadow: var(--glow-pink);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .seek-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Download Button */
        .download-btn {
            width: 100%;
            padding: 1rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            border-radius: 2px;
            color: var(--neon-cyan);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            background: var(--neon-cyan);
            color: var(--deep-void);
            box-shadow: var(--glow-cyan);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Error Message */
        .error-message {
            display: none;
            padding: 1rem;
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            border-radius: 2px;
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        .error-message.active {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 2;
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.2em;
        }

        .footer span {
            color: var(--neon-pink);
        }

        /* Debug Toggle */
        .debug-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .debug-toggle:hover {
            color: var(--neon-purple);
        }

        .debug-toggle input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid rgba(148, 0, 211, 0.5);
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .debug-toggle input[type="checkbox"]:checked {
            background: var(--neon-purple);
            border-color: var(--neon-purple);
            box-shadow: var(--glow-purple);
        }

        .debug-toggle input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 4px;
            width: 4px;
            height: 8px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Debug Files Section */
        .debug-section {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(148, 0, 211, 0.2);
        }

        .debug-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .debug-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--neon-purple);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            text-align: center;
            opacity: 0.7;
        }

        .debug-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .debug-btn {
            padding: 0.5rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid rgba(148, 0, 211, 0.4);
            border-radius: 2px;
            color: var(--neon-purple);
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .debug-btn:hover {
            background: rgba(148, 0, 211, 0.2);
            border-color: var(--neon-purple);
            box-shadow: var(--glow-purple);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .converter-card {
                padding: 2rem 1.5rem;
            }

            .logo h1 {
                letter-spacing: 0.1em;
            }

            .logo .tagline {
                letter-spacing: 0.2em;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="particles" id="particles"></div>
    </div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="logo">
            <h1>VELOCITYCORE</h1>
            <p class="tagline">Nightcore Generator</p>
        </div>

        <div class="converter-card">
            <div class="input-section">
                <label class="input-label">YouTube URL</label>
                <div class="input-wrapper">
                    <input type="text" class="url-input" id="urlInput" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
                </div>
            </div>

            <button class="convert-btn" id="convertBtn">
                <span>Convert to Nightcore</span>
            </button>

            <label class="debug-toggle">
                <input type="checkbox" id="debugToggle">
                <span>Keep intermediate tracks for debugging</span>
            </label>

            <div class="error-message" id="errorMessage"></div>

            <div class="progress-section" id="progressSection">
                <div class="progress-status" id="progressStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Initializing...</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="player-section" id="playerSection">
                <div class="track-title" id="trackTitle">Nightcore Track</div>

                <div class="visualizer" id="visualizer">
                    <!-- Bars generated by JS -->
                </div>

                <div class="audio-controls">
                    <span class="time-display" id="currentTime">0:00</span>
                    <button class="play-btn" id="playBtn">
                        <svg class="play-icon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="pause-icon" viewBox="0 0 24 24">
                            <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                        </svg>
                    </button>
                    <span class="time-display" id="duration">0:00</span>
                </div>

                <div class="seek-container">
                    <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0">
                </div>

                <button class="download-btn" id="downloadBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    Download Nightcore
                </button>

                <div class="debug-section" id="debugSection">
                    <div class="debug-title">Debug Tracks</div>
                    <div class="debug-buttons" id="debugButtons">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by <span>FFmpeg</span> + <span>yt-dlp</span>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';

                // Random colors for some particles
                const colors = ['#ff1493', '#00ffff', '#9400d3', '#ffffff'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                container.appendChild(particle);
            }
        }

        // Create visualizer bars
        function createVisualizerBars() {
            const visualizer = document.getElementById('visualizer');
            const barCount = 30;

            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '20%';
                bar.style.animationDelay = (i * 0.05) + 's';
                visualizer.appendChild(bar);
            }
        }

        // Format time
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + secs.toString().padStart(2, '0');
        }

        // Main app logic
        const urlInput = document.getElementById('urlInput');
        const convertBtn = document.getElementById('convertBtn');
        const debugToggle = document.getElementById('debugToggle');
        const progressSection = document.getElementById('progressSection');
        const progressStatus = document.getElementById('progressStatus');
        const progressFill = document.getElementById('progressFill');
        const playerSection = document.getElementById('playerSection');
        const trackTitle = document.getElementById('trackTitle');
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');
        const visualizer = document.getElementById('visualizer');
        const debugSection = document.getElementById('debugSection');
        const debugButtons = document.getElementById('debugButtons');

        let currentJobId = null;
        let isPlaying = false;

        // Initialize
        createParticles();
        createVisualizerBars();

        // Animate visualizer bars randomly
        function animateVisualizerBars() {
            const bars = visualizer.querySelectorAll('.visualizer-bar');
            bars.forEach(function(bar) {
                if (isPlaying) {
                    bar.style.height = (Math.random() * 80 + 20) + '%';
                } else {
                    bar.style.height = '20%';
                }
            });
        }

        setInterval(animateVisualizerBars, 100);

        // Convert button click
        convertBtn.addEventListener('click', async function() {
            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            hideError();
            convertBtn.disabled = true;
            progressSection.classList.add('active');
            playerSection.classList.remove('active');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        debug: debugToggle.checked
                    })
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    convertBtn.disabled = false;
                    progressSection.classList.remove('active');
                    return;
                }

                currentJobId = data.job_id;
                pollStatus();
            } catch (err) {
                showError('Failed to start conversion');
                convertBtn.disabled = false;
                progressSection.classList.remove('active');
            }
        });

        // Poll for status
        async function pollStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch('/api/status/' + currentJobId);
                const data = await response.json();

                updateProgress(data);

                if (data.status === 'complete') {
                    showPlayer(data);
                } else if (data.status === 'error') {
                    showError(data.message || 'Conversion failed');
                    convertBtn.disabled = false;
                    progressSection.classList.remove('active');
                } else {
                    setTimeout(pollStatus, 1000);
                }
            } catch (err) {
                setTimeout(pollStatus, 2000);
            }
        }

        // Update progress display
        function updateProgress(data) {
            const statusText = progressStatus.querySelector('.status-text');

            progressStatus.className = 'progress-status status-' + data.status;

            switch (data.status) {
                case 'queued':
                    statusText.textContent = 'Queued...';
                    progressFill.style.width = '5%';
                    break;
                case 'downloading':
                    statusText.textContent = 'Downloading from YouTube...';
                    progressFill.style.width = '15%';
                    break;
                case 'separating':
                    statusText.textContent = 'AI separating vocals...';
                    progressFill.style.width = '35%';
                    break;
                case 'converting':
                    statusText.textContent = 'Converting to Nightcore...';
                    progressFill.style.width = '50%';
                    break;
                case 'processing':
                    statusText.textContent = 'Creating vocal sub-layer...';
                    progressFill.style.width = '65%';
                    break;
                case 'mixing':
                    statusText.textContent = 'Mixing final track...';
                    progressFill.style.width = '85%';
                    break;
                case 'complete':
                    statusText.textContent = 'Complete!';
                    progressFill.style.width = '100%';
                    break;
            }
        }

        // Show player
        function showPlayer(data) {
            trackTitle.textContent = data.title || 'Nightcore Track';
            audioPlayer.src = '/api/stream/' + currentJobId;
            downloadBtn.onclick = function() {
                window.location.href = '/api/download/' + currentJobId;
            };

            // Handle debug files
            if (data.debug_files && data.debug_files.length > 0) {
                debugButtons.innerHTML = '';
                const trackLabels = {
                    'vocals': 'Vocals',
                    'instrumental': 'Instrumental',
                    'sub_vocals': 'Sub-octave Vocals'
                };
                data.debug_files.forEach(function(trackType) {
                    const btn = document.createElement('button');
                    btn.className = 'debug-btn';
                    btn.textContent = trackLabels[trackType] || trackType;
                    btn.onclick = function() {
                        window.location.href = '/api/debug/' + currentJobId + '/' + trackType;
                    };
                    debugButtons.appendChild(btn);
                });
                debugSection.classList.add('active');
            } else {
                debugSection.classList.remove('active');
            }

            playerSection.classList.add('active');
            convertBtn.disabled = false;
        }

        // Play/Pause
        playBtn.addEventListener('click', function() {
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.classList.remove('playing');
                visualizer.classList.remove('playing');
            } else {
                audioPlayer.play();
                playBtn.classList.add('playing');
                visualizer.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        // Audio events
        audioPlayer.addEventListener('loadedmetadata', function() {
            durationEl.textContent = formatTime(audioPlayer.duration);
            seekBar.max = Math.floor(audioPlayer.duration);
        });

        audioPlayer.addEventListener('timeupdate', function() {
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            seekBar.value = Math.floor(audioPlayer.currentTime);
        });

        audioPlayer.addEventListener('ended', function() {
            isPlaying = false;
            playBtn.classList.remove('playing');
            visualizer.classList.remove('playing');
        });

        seekBar.addEventListener('input', function() {
            audioPlayer.currentTime = seekBar.value;
        });

        // Error handling
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('active');
        }

        function hideError() {
            errorMessage.classList.remove('active');
        }

        // Enter key to convert
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertBtn.click();
            }
        });
    </script>
</body>
</html>
